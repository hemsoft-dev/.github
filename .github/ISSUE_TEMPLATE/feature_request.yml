name: Feature request
description: Propose an improvement to a HemSoft project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing the implementation. This helps us judge the request without locking into one design too early.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who has the problem, what they are trying to do, and what blocks them today.
      placeholder: Describe the current problem and its impact.
    validations:
      required: true

  - type: textarea
    id: use_cases
    attributes:
      label: Use cases
      description: Give concrete examples of when this improvement would be valuable.
      placeholder: |
        1. When...
        2. When...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What outcome do you want?
      description: Describe the user-visible result, not only the implementation.
      placeholder: Describe what becomes possible or easier.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions that would make this request complete.
      placeholder: |
        - A user can...
        - The system does not...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what belongs in this request and what should remain unchanged.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Share an implementation idea if you have one.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.

  - type: textarea
    id: constraints
    attributes:
      label: Dependencies and constraints
      description: Include compatibility requirements, related issues, external dependencies, or known risks.

  - type: textarea
    id: validation
    attributes:
      label: Suggested validation plan
      description: Suggest automated tests, manual checks, or success measurements when known. Maintainers must complete this before assigning implementation work.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, files, links, or related issues.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find an equivalent request.
          required: true
